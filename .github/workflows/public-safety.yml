name: public-safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard newly published content
        env:
          PUBLIC_REDACTION_GUARD_RE: ${{ secrets.PUBLIC_REDACTION_GUARD_RE }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi
          bash scripts/public-safety-guard.sh --base-ref "$base_ref"

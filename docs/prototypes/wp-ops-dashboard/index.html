<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>キーワード施策ボード</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">HELIX WP HARNESS</p>
      <h1>キーワード施策ボード</h1>
    </div>
    <div class="site-controls"><div id="site-selector" class="site-tabs" role="tablist" aria-label="対象サイト"></div><div class="freshness"><span class="dot"></span><span id="freshness">実データ読込中</span></div></div>
  </header>

  <nav class="tabs" aria-label="表示切替">
    <button class="tab active" data-view="keywords">キーワード一覧</button>
    <button class="tab" data-view="article-queries">記事獲得クエリ</button>
    <button class="tab" data-view="internal-links">内部リンクマップ</button>
  </nav>

  <main>
    <section id="keywords" class="view active">
      <div class="metrics" id="metrics"></div>
      <div class="toolbar table-toolbar">
        <div>
          <h2>メイン施策キーワード一覧</h2>
          <p>1行＝1記事候補。DBに取り込んだsource_order順で表示</p>
        </div>
        <div class="filters">
          <input id="keyword-search" type="search" placeholder="キーワード検索" aria-label="キーワード検索">
          <select id="category-filter" aria-label="カテゴリーで絞り込み"><option value="all">全カテゴリー</option></select>
          <select id="parent-filter" aria-label="メインキーワードで絞り込み"><option value="all">全メインKW</option></select>
          <select id="state-filter" aria-label="状態で絞り込み"><option value="all">全状態</option></select>
          <select id="page-size" aria-label="表示件数"><option value="25">25件表示</option><option value="50">50件表示</option><option value="100">100件表示</option><option value="all">すべて表示</option></select>
        </div>
      </div>
      <div class="layout table-layout">
        <div class="table-wrap">
          <table><thead><tr><th>カテゴリー</th><th>メインKW</th><th>検索Vol</th><th>内包KW</th><th>AIO</th><th>施策状態</th><th>WP ID</th><th></th></tr></thead><tbody id="keyword-rows"></tbody></table>
          <div id="table-empty"></div>
          <div id="pagination" class="pagination" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section id="article-queries" class="view">
      <div class="section-head">
        <div><h2>記事獲得クエリ</h2><p>WordPress記事IDごとにGSCで実際に獲得した検索クエリを表示</p></div>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>記事</th><th>WP ID</th><th>獲得クエリ</th><th>表示回数</th><th>クリック</th><th>平均掲載順位</th><th>取得期間</th></tr></thead><tbody id="query-rows"></tbody></table>
        <div id="query-empty" class="empty-state"></div>
      </div>
    </section>

    <section id="internal-links" class="view">
      <div class="section-head">
        <div><h2>内部リンクマップ</h2><p>記事間リンク、孤立記事、ハブ、カテゴリ間導線を表示</p></div>
      </div>
      <div id="link-map" class="map-empty"></div>
    </section>
  </main>

  <dialog id="detail-dialog">
    <div class="dialog-head"><span>判定詳細</span><button id="detail-close" type="button" aria-label="閉じる">×</button></div>
    <div class="detail" id="group-detail" aria-live="polite"></div>
  </dialog>
  <dialog id="site-dialog">
    <div class="dialog-head"><span>サイト一覧</span><button id="site-close" type="button" aria-label="閉じる">×</button></div>
    <div class="site-directory"><input id="site-search" type="search" placeholder="サイト名・ドメインで検索" aria-label="サイト検索"><div id="site-list"></div></div>
  </dialog>

  <template id="empty-template"><div class="empty"><strong>該当データがありません</strong><span>フィルターを変更してください。</span></div></template>
  <script type="module" src="app.js"></script>
</body>
</html>
